<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="cam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95"/>
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:0.95"/>
    </linearGradient>
  </defs>
  <!-- Background rounded rect -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Camera body -->
  <rect x="8" y="20" width="36" height="26" rx="5" fill="url(#cam)"/>
  <!-- Camera lens -->
  <circle cx="26" cy="33" r="9" fill="#7c3aed"/>
  <circle cx="26" cy="33" r="6" fill="#4c1d95"/>
  <circle cx="26" cy="33" r="3" fill="#7c3aed"/>
  <circle cx="23" cy="30" r="1.5" fill="rgba(255,255,255,0.5)"/>
  <!-- Viewfinder bump -->
  <rect x="14" y="15" width="12" height="7" rx="3" fill="url(#cam)"/>
  <!-- Play triangle on lens -->
  <polygon points="24,30 24,36 30,33" fill="white" opacity="0.9"/>
  <!-- Camera side fin (GoPro style) -->
  <rect x="44" y="24" width="12" height="10" rx="3" fill="url(#cam)" opacity="0.9"/>
  <rect x="46" y="27" width="8" height="4" rx="2" fill="#7c3aed"/>
  <!-- Record dot -->
  <circle cx="38" cy="22" r="3" fill="#ef4444"/>
  <!-- Bottom route line -->
  <path d="M10 52 Q20 46 32 50 Q44 54 54 48" stroke="white" stroke-width="2" fill="none" opacity="0.6" stroke-linecap="round"/>
  <circle cx="10" cy="52" r="2" fill="white" opacity="0.8"/>
  <circle cx="54" cy="48" r="2" fill="white" opacity="0.8"/>
</svg>
